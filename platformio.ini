; PlatformIO Project Configuration File
;
; Pico 2 Disaster Alert Display with Seengreat HUB75 Adapter
;
; Build: pio run
; Upload: pio run -t upload
; Monitor: pio device monitor

;[platformio]
;default_envs = pico2w_seengreat



[env:ttgo_t_display]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
 
; ==================== PICO 2 W with Seengreat Adapter ====================
;[env:pico2w_seengreat]
;platform = https://github.com/maxgerhardt/platform-raspberrypi.git
;board = rpipico2w
;framework = arduino

; Board definition
;build_flags = 
 ;   -DBOARD_SEENGREAT
;    -DPICO_CYW43_SUPPORTED=1
 ;   -DCYW43_LWIP=1
 ;   -DLWIP_IPV4=1
 ;   -DLWIP_DNS=1
 ;   -DARDUINO_ARCH_RP2040
  ;  -I src

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1;
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D CGRAM_OFFSET=1
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000


; Library dependencies
lib_deps = 
    ; WiFi support (built into framework)
    ; ArduinoJson for parsing
    bblanchon/ArduinoJson@^7.0.0

    bodmer/TFT_eSPI@^2.4.66
    bblanchon/ArduinoJson@^6.21.3



; Upload settings
upload_protocol = picotool

; Monitor settings
;monitor_speed = 115200.
;monitor_filters = esp32_exception_decoder

; ==================== PICO W (Original) with Seengreat ====================
[env:picow_seengreat]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino

build_flags = 
    -DBOARD_SEENGREAT
    -DPICO_CYW43_SUPPORTED=1
    -DCYW43_LWIP=1
    -I src

lib_deps = 
    bblanchon/ArduinoJson@^7.0.0

upload_protocol = picotool
monitor_speed = 115200

; ==================== Pimoroni Interstate 75 ====================
[env:interstate75]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino

build_flags = 
    -DBOARD_INTERSTATE75
    -DPICO_CYW43_SUPPORTED=1
    -DCYW43_LWIP=1
    -I src

lib_deps = 
    bblanchon/ArduinoJson@^7.0.0

upload_protocol = picotool
monitor_speed = 115200

; ==================== Custom Board ====================
[env:custom]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino

build_flags = 
    -DBOARD_CUSTOM
    -DPICO_CYW43_SUPPORTED=1
    -DCYW43_LWIP=1
    -I src

lib_deps = 
    bblanchon/ArduinoJson@^7.0.0

upload_protocol = picotool
monitor_speed = 115200
